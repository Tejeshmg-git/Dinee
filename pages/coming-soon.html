<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dineé | Something Exceptional is Coming</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/coming-soon.css">
</head>
<body class="coming-soon-body">

<div class="ambient-bg"></div>

<section class="coming-container">
  <div class="content">
    
    <div class="brand-signature">
      <div class="logo-wrap">
        <img src="../assets/images/logo.png" alt="Dineé Logo" class="brand-image">
      </div>
      <div class="brand-logo">Dineé</div>
    </div>
    <span class="tag">COMING SOON</span>

    <h1>Something Exceptional<br>is Coming</h1>

    <p>
      We're crafting a refined experience for you. Stay tuned for something truly luxurious.
    </p>

    <!-- Countdown -->
    <div class="countdown">
      <div><span id="days">00</span><small>Days</small></div>
      <div><span id="hours">00</span><small>Hours</small></div>
      <div><span id="minutes">00</span><small>Minutes</small></div>
      <div><span id="seconds">00</span><small>Seconds</small></div>
    </div>

    <!-- Email -->
    <div class="subscribe">
      <div class="input-wrapper">
        <input type="email" id="subscriber-email" placeholder="Your best email">
        <button id="notify-btn">Notify Me</button>
      </div>
    </div>

    <div class="return-link">
      <a href="../index.html">← Back to Preview</a>
    </div>

  </div>
</section>

<!-- Scripts -->
<script src="../assets/js/main.js"></script>
<script src="../assets/js/coming-soon.js"></script>
</body>
</html>
